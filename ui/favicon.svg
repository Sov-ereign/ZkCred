<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d0b1a" />
      <stop offset="100%" stop-color="#050408" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="150" y1="120" x2="360" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="rgba(167, 139, 250, 0.15)" stroke-width="2" />

  <!-- Shield Outer Path -->
  <path d="M256 64L100 136V264C100 360 168 440 256 464C344 440 412 360 412 264V136L256 64Z" 
        fill="rgba(124, 58, 237, 0.12)" 
        stroke="url(#shieldBorder)" 
        stroke-width="14" 
        stroke-linejoin="round" 
        filter="url(#glowEffect)" />

  <!-- Midnight Moon Crescent Motif -->
  <path d="M280 160A76 76 0 1 0 340 280A90 90 0 1 1 280 160Z" fill="url(#coreGlow)" opacity="0.9" />

  <!-- ZK Keyhole / Lock Core -->
  <circle cx="256" cy="245" r="28" fill="#ffffff" />
  <path d="M242 260L236 330H276L270 260Z" fill="#ffffff" />

  <!-- Verification Checkmark -->
  <path d="M190 260L230 300L320 200" stroke="#34d399" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowEffect)" />
</svg>
