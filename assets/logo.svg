<svg width="600" height="160" viewBox="0 0 600 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="20" y1="10" x2="130" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="textGrad" x1="160" y1="40" x2="450" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4b5fd" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Shield Icon -->
  <g transform="translate(15, 10)">
    <path d="M70 15L20 40V80C20 115 42 144 70 152C98 144 120 115 120 80V40L70 15Z" 
          fill="rgba(124, 58, 237, 0.15)" 
          stroke="url(#shieldGrad)" 
          stroke-width="5" 
          filter="url(#glow)" />
    <!-- Crescent Moon -->
    <path d="M78 50A24 24 0 1 0 96 90A30 30 0 1 1 78 50Z" fill="#06b6d4" opacity="0.85" />
    <!-- Checkmark -->
    <path d="M48 82L62 96L92 64" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brand Typography -->
  <text x="160" y="95" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="64" fill="url(#textGrad)" letter-spacing="-1.5">AegisID</text>
  
  <!-- Pill Badge -->
  <rect x="420" y="52" width="105" height="34" rx="17" fill="rgba(124, 58, 237, 0.2)" stroke="rgba(167, 139, 250, 0.4)" stroke-width="1.5" />
  <text x="437" y="74" font-family="JetBrains Mono, monospace" font-weight="700" font-size="14" fill="#38bdf8" letter-spacing="1">ZkCred</text>
  
  <!-- Subtitle -->
  <text x="162" y="125" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="16" fill="rgba(196, 181, 253, 0.6)" letter-spacing="0.5">Privacy-First ZK Eligibility Gate · Midnight Network</text>
</svg>
