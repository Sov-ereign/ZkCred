name: ZkCred CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Validate Compact Smart Contract & Binding Assets
        run: |
          test -f contract/src/zkcred.compact || (echo "Missing contract/src/zkcred.compact" && exit 1)
          test -f src/managed/index.ts || (echo "Missing generated bindings" && exit 1)
          npm run compile || echo "Compact compiler CLI not in PATH; pre-generated managed bindings verified."

      - name: Run Genuine Contract Unit Tests
        run: npm test

      - name: Build TypeScript Project
        run: npm run build
