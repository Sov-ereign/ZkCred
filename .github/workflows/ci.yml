name: ZkCred CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Validate generated Compact proof assets
        run: |
          test -f contract/src/zkcred.compact
          test -s src/managed/contract/index.js
          test -s src/managed/keys/initialize.prover
          test -s src/managed/keys/verifyEligibility.prover
          test -s src/managed/zkir/initialize.bzkir
          test -s src/managed/zkir/verifyEligibility.bzkir

      - name: Run privacy and contract-asset tests
        run: npm test

      - name: Build TypeScript Project
        run: |
          npm run build
          npm run ui:build
