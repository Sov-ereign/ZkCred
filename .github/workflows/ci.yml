name: ZkCred CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pinned Compact compiler
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: '0.31.1'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Recompile contract from source
        run: |
          compact compile contract/src/zkcred-v3.compact src/managed-v3
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Committed bindings or proof assets do not reproduce from the pinned Compact compiler."
            git status --short --untracked-files=all
            exit 1
          fi

      - name: Validate generated Compact proof assets exist
        run: |
          test -f contract/src/zkcred.compact
          test -s src/managed/contract/index.js
          test -s src/managed/keys/initialize.prover
          test -s src/managed/keys/verifyEligibility.prover
          test -s src/managed/keys/updateThresholds.prover
          test -s src/managed/zkir/initialize.bzkir
          test -s src/managed/zkir/verifyEligibility.bzkir
          test -s src/managed/zkir/updateThresholds.bzkir
          test -f contract/src/zkcred-v3.compact
          test -f contract/src/schnorr.compact
          test -s src/managed-v3/contract/index.js
          test -s src/managed-v3/keys/verifyEligibility.prover
          test -s src/managed-v3/zkir/verifyEligibility.bzkir

      - name: Pin and verify Compact artifact checksums
        run: |
          CHECKSUMS_FILE="src/managed/.artifact-checksums"
          if [ ! -f "$CHECKSUMS_FILE" ]; then
            echo "[CI] ERROR: $CHECKSUMS_FILE is missing. Pinned artifacts must be committed."
            exit 1
          fi
          echo "[CI] Verifying Compact artifact checksums against pinned hashes..."
          sha256sum --check --strict "$CHECKSUMS_FILE"
          echo "[CI] All Compact artifacts verified against pinned checksums."

      - name: Run privacy and contract-asset tests
        run: npm test

      - name: Build TypeScript Project
        run: |
          npm run build
          npm run ui:build
