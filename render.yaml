services:
  # ─── ZkCred API (Express + MongoDB + Google OAuth) ────────────────────────
  # Deployed at: https://zkcred-api.onrender.com
  - type: web
    name: zkcred-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://zkcred-api.onrender.com/api/auth/google/callback
      - key: CONTRACT_ADDRESS
        value: 56e2bee56953f107b0a20496f64d7a08be62a58626e8fec8a0102c798217f16a
      - key: MIDNIGHT_INDEXER_URL
        value: https://indexer.preprod.midnight.network/api/v3/graphql
    healthCheckPath: /api/health
