services:
  # ─── ZkCred API (Express + MongoDB + Google OAuth) ────────────────────────
  # Deployed at: https://zkcred-api.onrender.com
  - type: web
    name: zkcred-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://zkcred-api.onrender.com/api/auth/google/callback
      - key: CONTRACT_ADDRESS
        value: "0x0225677b7557435054732329333e104b4a0c5ce8e5fdd9d3cdcbdfc997a8bdab"
      - key: MIDNIGHT_INDEXER_URL
        value: https://indexer.preprod.midnight.network/api/v3/graphql
    healthCheckPath: /api/health
